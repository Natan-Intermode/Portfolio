<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Executive Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..900&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --page:#eef1f6; --frame:#ffffff; --card:#002147; --card2:#0a3566; --text:#ffffff;
  --accent:#4cc9e3; --heading:#002147; --head-bg:#21688a; --num-bg:#52d0ea; --num:#ffffff;
  --urgent:#ff5a5f; --progress:#ffb703; --notstarted:#4cc9e3; --input:#ffffff1a;
}
body[data-theme="cream"]{
  --page:#f1e7bd; --frame:#fff9df; --card:#f6e49a; --card2:#ecd57a; --text:#2b2200;
  --accent:#9a6a00; --heading:#3a2d00; --head-bg:#c99a1c; --num-bg:#fbefb8; --num:#3a2d00;
  --urgent:#c0392b; --progress:#d97a00; --notstarted:#2f7d5b; --input:#00000012;
}
*{box-sizing:border-box;margin:0}
body{font-family:'Work Sans',system-ui,sans-serif;background:var(--page);color:var(--text);min-height:100vh;padding:28px 16px;transition:background .3s}
.frame{max-width:1180px;margin:auto;background:var(--frame);border-radius:20px;padding:24px;transition:background .3s}
h1,h2,.big,.name{font-family:'Archivo',sans-serif;font-stretch:80%;letter-spacing:-.01em}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.top h1{font-size:1.35rem;font-weight:800;color:var(--heading);text-transform:uppercase}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.theme{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--card);color:var(--text);font-weight:600;font-size:.85rem}
.theme svg{width:18px;height:18px;fill:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{background:var(--card);color:var(--text);border-radius:24px;padding:18px 20px;transition:background .3s,transform .15s}
button.card{text-align:left;width:100%}
button.card:hover{transform:translateY(-3px)}
.profile{grid-column:span 9;display:flex;gap:16px;align-items:flex-start;min-height:140px}
.avatar{width:84px;fill:var(--accent);flex:none}
.name{font-size:2.1rem;font-weight:800;text-transform:uppercase;line-height:1}
.role{font-size:.95rem;opacity:.9;margin-top:6px}
.clock{grid-column:span 3;text-align:center}
.clock small{font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em}
.time{font-family:'Archivo',sans-serif;font-stretch:75%;font-weight:900;font-size:3.6rem;line-height:1.05}
.time sub{font-size:.9rem;font-weight:500;margin-left:4px;vertical-align:baseline}
.clock .ctry{font-size:.85rem}
.clock .hint{display:block;font-size:.7rem;opacity:.7;margin-top:4px}
.feat{grid-column:span 3;display:flex;flex-direction:column;gap:6px;justify-content:center;min-height:92px}
.feat .lbl{color:var(--accent);font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
.feat .big{font-size:1.65rem;font-weight:800;display:flex;align-items:center;gap:10px}
.feat .big svg{width:30px;height:30px;flex:none}
.icon-human{fill:var(--accent);transition:fill .4s}
.board{grid-column:span 9}
.board h2,.side h2{font-size:1.3rem;font-weight:800;text-transform:uppercase;margin-bottom:12px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.col{border-radius:22px;overflow:hidden;background:var(--num-bg);text-align:center}
.col .h{background:var(--head-bg);color:#fff;font-weight:700;font-size:clamp(.7rem,1.5vw,.9rem);padding:0 8px;height:46px;white-space:nowrap;text-transform:uppercase;display:flex;justify-content:center;align-items:center;gap:8px}
.col .h i{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.col .n{font-family:'Archivo',sans-serif;font-weight:900;font-size:5rem;line-height:1.3;color:var(--num)}
.side{grid-column:span 3}
.side p{font-size:.95rem;line-height:1.5}
.side .when{font-family:'Archivo',sans-serif;font-weight:800;font-size:2rem;color:var(--accent)}
.panel{margin-top:18px;position:relative;cursor:pointer}
.panel-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.panel-h h2{font-size:1.25rem;font-weight:800;color:var(--heading);text-transform:uppercase}
.panel-h svg{width:28px;fill:#55606f}
.open{margin-left:auto;font-size:.8rem;font-weight:600;padding:7px 14px;border-radius:999px;background:var(--card);color:var(--text)}
.box{background:var(--card);color:var(--text);border-radius:24px;padding:16px 20px;transition:background .3s}
.box{color-scheme:dark}
body[data-theme="cream"] .box{color-scheme:light}
.box:hover{box-shadow:0 0 0 3px var(--accent)}
.row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #ffffff22;flex-wrap:wrap}
body[data-theme="cream"] .row{border-color:#00000020}
.row .t{flex:1;min-width:140px}
.row select,.row input,.add select,.add input{background:var(--input);border:1px solid #ffffff30;border-radius:10px;padding:6px 10px}
.row select option,.add select option{color:#000}
.x{opacity:.7;font-size:1.1rem;padding:2px 8px}
.x:hover{opacity:1}
.add{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.add input{flex:1;min-width:150px}
.add button{background:var(--accent);color:#fff;font-weight:700;padding:7px 16px;border-radius:10px}
body[data-theme="cream"] .add button{color:#fff8dc}
.empty{opacity:.7;padding:8px 0;font-size:.9rem}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.veil{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.veil.on{display:flex}
.modal{background:var(--card);color:var(--text);border-radius:24px;padding:24px;max-width:460px;width:100%;max-height:85vh;overflow:auto;animation:pop .18s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.modal h3{font-family:'Archivo',sans-serif;font-size:1.5rem;margin-bottom:8px}
.modal p{line-height:1.5;margin-bottom:14px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.modal .btn{background:var(--accent);color:#fff;padding:8px 18px;border-radius:10px;font-weight:700}
.modal .ghost{background:var(--input)}
.modal input[type=search]{width:100%;background:var(--input);border:1px solid #ffffff30;border-radius:10px;padding:9px 12px;margin-bottom:10px}
.clist{display:flex;flex-direction:column;gap:4px;max-height:46vh;overflow:auto}
.clist button{text-align:left;padding:9px 12px;border-radius:10px;display:flex;justify-content:space-between;gap:10px}
.clist button:hover,.clist button.cur{background:var(--input)}
.clist span{opacity:.7;font-size:.85rem}
@media(max-width:900px){.profile,.board{grid-column:span 12}.clock,.side{grid-column:span 12}.feat{grid-column:span 6}.name{font-size:1.6rem}}
@media(max-width:520px){.feat{grid-column:span 12}.cols{grid-template-columns:1fr}.col .n{font-size:3.5rem}.top{gap:10px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body data-theme="navy">
<div class="frame">
  <div class="top">
    <h1>Executive Dashboard</h1>
    <button class="theme" id="themeBtn" aria-label="Switch dashboard colors">
      <svg viewBox="0 0 24 24"><path d="M9 21h6v-1H9v1zm3-19a7 7 0 0 0-4 12.7V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.3A7 7 0 0 0 12 2z"/></svg>
      <span id="themeLbl">Cream mode</span>
    </button>
  </div>

  <div class="grid">
    <div class="card profile">
      <svg class="avatar" viewBox="0 0 100 100"><circle cx="50" cy="26" r="20"/><path d="M8 98c0-22 14-40 42-40s42 18 42 40z"/><path d="M50 58l-7 10 7 22 7-22z" fill="var(--card)"/></svg>
      <div><div class="name">Lier Consig</div><div class="role">Chief Executive Officer &amp; Co-Founder</div></div>
    </div>

    <button class="card clock" id="clockBtn" aria-label="Change country for world clock">
      <small>World Clock</small>
      <div class="time"><span id="tm">--:--</span><sub id="ap"></sub></div>
      <div class="ctry" id="ctry">United States</div>
      <span class="hint">Click to change country</span>
    </button>

    <button class="card feat" data-f="schedule"><span class="lbl">Today's Schedule</span>
      <span class="big"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2" fill="#fff"/><path d="M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v3H3z" fill="#e5484d"/><g fill="#9aa4b2"><rect x="6" y="12" width="3" height="2"/><rect x="10.5" y="12" width="3" height="2"/><rect x="15" y="12" width="3" height="2"/><rect x="6" y="16" width="3" height="2"/><rect x="10.5" y="16" width="3" height="2"/></g></svg><span id="fMeet">0 Meetings</span></span></button>
    <button class="card feat" data-f="approval"><span class="lbl">Pending Approval</span>
      <span class="big" id="fUrg">0 Urgent</span></button>
    <button class="card feat" data-f="priority"><span class="lbl">Priority Task</span>
      <span class="big"><svg viewBox="0 0 100 100" class="icon-human" id="prioIcon"><circle cx="50" cy="26" r="20"/><path d="M8 98c0-22 14-40 42-40s42 18 42 40z"/></svg><span id="fAct">0 Active</span></span></button>
    <button class="card feat" data-f="travel"><span class="lbl">Travel &amp; Logistics</span>
      <span class="big" id="fTravel">United States</span></button>

    <div class="card board">
      <h2>Task Board Highlight</h2>
      <div class="cols">
        <div class="col"><div class="h"><i style="background:var(--urgent)"></i>Urgent</div><div class="n" id="nU">0</div></div>
        <div class="col"><div class="h"><i style="background:var(--progress)"></i>In Progress</div><div class="n" id="nP">0</div></div>
        <div class="col"><div class="h"><i style="background:var(--notstarted)"></i>Not Started</div><div class="n" id="nN">0</div></div>
      </div>
    </div>
    <div class="card side">
      <h2>Next Meeting</h2>
      <div class="when" id="nextWhen">--</div>
      <p id="nextTitle">No meetings logged yet.</p>
    </div>
  </div>

  <section class="panel" id="trackerPanel" data-canva="tasks">
    <div class="panel-h">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="26" r="20"/><path d="M8 98c0-22 14-40 42-40s42 18 42 40z"/></svg>
      <h2>Executive Task Tracker</h2>
      <button class="open" data-open="tasks">Open task tracker in Google Sheets</button>
    </div>
    <div class="box"><div id="taskList"></div>
      <form class="add" id="taskForm"><input id="taskIn" placeholder="Add a task" aria-label="New task" required>
        <input type="time" id="taskTm" aria-label="Task time" required style="flex:none;min-width:0">
        <select id="taskSt" aria-label="Task status"><option value="urgent">Urgent</option><option value="progress">In progress</option><option value="notstarted">Not started</option></select>
        <button type="submit">Add task</button></form>
    </div>
  </section>

  <section class="panel" id="meetingPanel" data-canva="meetings">
    <div class="panel-h">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="26" r="20"/><path d="M8 98c0-22 14-40 42-40s42 18 42 40z"/></svg>
      <h2>Meeting Log</h2>
      <button class="open" data-open="meetings">Open meeting log in Google Sheets</button>
    </div>
    <div class="box"><div id="meetList"></div>
      <form class="add" id="meetForm"><input id="meetIn" placeholder="Add a meeting" aria-label="New meeting" required>
        <input type="time" id="meetTm" aria-label="Meeting time" required style="flex:none;min-width:0">
        <button type="submit">Add meeting</button></form>
    </div>
  </section>
</div>

<div class="veil" id="veil"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>

<script>
/* ===== SETTINGS: replace these links whenever you're ready ===== */
const LINKS = {
  tasks:    "https://docs.google.com/spreadsheets/",   // Google Sheet for the Executive Task Tracker
  meetings: "https://docs.google.com/spreadsheets/",   // Google Sheet for the Meeting Log
  schedule: "",   // Today's Schedule  -> calendar / list of meetings
  approval: "",   // Pending Approval
  priority: "",   // Priority Task
  travel:   ""    // Travel & Logistics
};
const FEATURES = {
  schedule:{t:"Today's Schedule",d:"This will open your calendar or list of today's meetings."},
  approval:{t:"Pending Approval",d:"This will open the items waiting for the executive's approval."},
  priority:{t:"Priority Task",d:"This will open the priority task view."},
  travel:{t:"Travel & Logistics",d:"This will open travel plans and logistics."}
};
const PLACES = [
 ["United States","New York","America/New_York"],["United States","Chicago","America/Chicago"],["United States","Denver","America/Denver"],["United States","Los Angeles","America/Los_Angeles"],["United States","Honolulu","Pacific/Honolulu"],
 ["Canada","Toronto","America/Toronto"],["Mexico","Mexico City","America/Mexico_City"],["Brazil","São Paulo","America/Sao_Paulo"],["Argentina","Buenos Aires","America/Argentina/Buenos_Aires"],
 ["United Kingdom","London","Europe/London"],["Ireland","Dublin","Europe/Dublin"],["France","Paris","Europe/Paris"],["Germany","Berlin","Europe/Berlin"],["Spain","Madrid","Europe/Madrid"],["Italy","Rome","Europe/Rome"],["Netherlands","Amsterdam","Europe/Amsterdam"],["Switzerland","Zurich","Europe/Zurich"],["Turkey","Istanbul","Europe/Istanbul"],["Russia","Moscow","Europe/Moscow"],
 ["United Arab Emirates","Dubai","Asia/Dubai"],["Saudi Arabia","Riyadh","Asia/Riyadh"],["Israel","Tel Aviv","Asia/Jerusalem"],["Egypt","Cairo","Africa/Cairo"],["South Africa","Johannesburg","Africa/Johannesburg"],["Nigeria","Lagos","Africa/Lagos"],["Kenya","Nairobi","Africa/Nairobi"],
 ["India","Mumbai","Asia/Kolkata"],["Pakistan","Karachi","Asia/Karachi"],["Bangladesh","Dhaka","Asia/Dhaka"],["Thailand","Bangkok","Asia/Bangkok"],["Vietnam","Ho Chi Minh City","Asia/Ho_Chi_Minh"],["Indonesia","Jakarta","Asia/Jakarta"],["Singapore","Singapore","Asia/Singapore"],["Malaysia","Kuala Lumpur","Asia/Kuala_Lumpur"],
 ["Philippines","Manila","Asia/Manila"],["Hong Kong","Hong Kong","Asia/Hong_Kong"],["China","Shanghai","Asia/Shanghai"],["Taiwan","Taipei","Asia/Taipei"],["South Korea","Seoul","Asia/Seoul"],["Japan","Tokyo","Asia/Tokyo"],
 ["Australia","Sydney","Australia/Sydney"],["Australia","Perth","Australia/Perth"],["New Zealand","Auckland","Pacific/Auckland"]
];
const STATUS = {urgent:"Urgent",progress:"In progress",notstarted:"Not started"};

/* ===== State (saved in this browser) ===== */
const $ = id => document.getElementById(id);
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let theme = store.get("theme","navy");
let tz = store.get("tz","America/New_York");
let tasks = store.get("tasks",[
  {t:"Approve Q4 budget",s:"urgent",tm:"09:30"},{t:"Sign vendor contract",s:"urgent",tm:"12:00"},
  {t:"Prepare board deck",s:"progress",tm:"13:30"},{t:"Review hiring plan",s:"progress",tm:"15:00"},
  {t:"Book offsite venue",s:"notstarted",tm:"16:30"}]);
let meetings = store.get("meetings",[
  {t:"Leadership sync",tm:"09:00"},{t:"Investor call",tm:"11:30"},{t:"Product review",tm:"14:00"}]);

/* ===== Theme ===== */
function applyTheme(){
  document.body.dataset.theme = theme;
  $("themeLbl").textContent = theme==="navy" ? "Cream mode" : "Navy mode";
  store.set("theme",theme);
}
$("themeBtn").onclick = () => { theme = theme==="navy" ? "cream" : "navy"; applyTheme(); };

/* ===== World clock ===== */
const place = () => PLACES.find(p=>p[2]===tz) || PLACES[0];
function tick(){
  try{
    const parts = new Intl.DateTimeFormat("en-US",{timeZone:tz,hour:"numeric",minute:"2-digit",hour12:true}).formatToParts(new Date());
    const g = t => (parts.find(p=>p.type===t)||{}).value||"";
    $("tm").textContent = g("hour")+":"+g("minute");
    $("ap").textContent = g("dayPeriod").toLowerCase();
  }catch(e){$("tm").textContent="--:--"}
}
function renderClockLabel(){
  const p = place();
  $("ctry").textContent = p[0]+" · "+p[1];
  $("fTravel").textContent = p[0];
}
function openCountryPicker(){
  openModal(`<h3>Choose a country</h3><p>The clock will show that country's local time.</p>
    <input type="search" id="cq" placeholder="Search country or city" aria-label="Search country or city">
    <div class="clist" id="clist"></div>
    <div class="acts"><button class="btn ghost" data-close>Close</button></div>`);
  const draw = q => {
    $("clist").innerHTML = "";
    PLACES.filter(p=>(p[0]+" "+p[1]).toLowerCase().includes(q.toLowerCase())).forEach(p=>{
      const b=document.createElement("button");
      if(p[2]===tz)b.className="cur";
      b.innerHTML="<b></b><span></span>"; b.firstChild.textContent=p[0]+" — "+p[1];
      try{b.lastChild.textContent=new Intl.DateTimeFormat("en-US",{timeZone:p[2],hour:"numeric",minute:"2-digit"}).format(new Date())}catch(e){}
      b.onclick=()=>{tz=p[2];store.set("tz",tz);renderClockLabel();tick();closeModal()};
      $("clist").appendChild(b);
    });
  };
  draw(""); $("cq").oninput = e => draw(e.target.value); $("cq").focus();
}
$("clockBtn").onclick = openCountryPicker;

/* ===== Modal ===== */
function openModal(html){ $("modal").innerHTML=html; $("veil").classList.add("on");
  $("modal").querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal); }
function closeModal(){ $("veil").classList.remove("on"); }
$("veil").onclick = e => { if(e.target.id==="veil") closeModal(); };
document.addEventListener("keydown", e => { if(e.key==="Escape") closeModal(); });

/* ===== Clickable features ===== */
document.querySelectorAll("[data-f]").forEach(b=>{
  b.onclick = () => {
    const k=b.dataset.f, f=FEATURES[k];
    if(LINKS[k]){ window.open(LINKS[k],"_blank","noopener"); return; }
    openModal(`<h3></h3><p></p><p style="opacity:.75">This button works. The destination will be set later in the LINKS settings.</p><div class="acts"><button class="btn" data-close>Got it</button></div>`);
    $("modal").querySelector("h3").textContent=f.t; $("modal").querySelector("p").textContent=f.d;
  };
});

/* ===== Google Sheets links (panels) ===== */
function openSheet(k){ if(LINKS[k]) window.open(LINKS[k],"_blank","noopener"); }
document.querySelectorAll(".panel").forEach(p=>{
  p.addEventListener("click", e => {
    if(e.target.closest("input,select,form,.x")) return;
    openSheet(p.dataset.canva);
  });
});

/* ===== Tasks & meetings ===== */
function rowEl(label, right){
  const r=document.createElement("div"); r.className="row";
  const t=document.createElement("span"); t.className="t"; t.textContent=label; r.appendChild(t);
  right.forEach(x=>r.appendChild(x)); return r;
}
function delBtn(fn){ const b=document.createElement("button"); b.className="x"; b.type="button"; b.textContent="✕"; b.setAttribute("aria-label","Remove"); b.onclick=e=>{e.stopPropagation();fn()}; return b; }

function renderTasks(){
  const L=$("taskList"); L.innerHTML="";
  if(!tasks.length){ L.innerHTML='<div class="empty">No tasks yet. Add one below.</div>'; }
  [...tasks].sort((a,b)=>(a.tm||"99:99").localeCompare(b.tm||"99:99")).forEach(t=>{
    const dot=document.createElement("span"); dot.className="dot"; dot.style.background=`var(--${t.s==="urgent"?"urgent":t.s==="progress"?"progress":"notstarted"})`;
    const tin=document.createElement("input"); tin.type="time"; tin.value=t.tm||""; tin.setAttribute("aria-label","Task time");
    tin.onclick=e=>e.stopPropagation();
    tin.onchange=()=>{t.tm=tin.value;saveAll()};
    const sel=document.createElement("select"); sel.setAttribute("aria-label","Status");
    Object.keys(STATUS).forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=STATUS[k];if(k===t.s)o.selected=true;sel.appendChild(o)});
    sel.onclick=e=>e.stopPropagation();
    sel.onchange=()=>{t.s=sel.value;saveAll()};
    const r=rowEl(t.t,[tin,sel,delBtn(()=>{tasks.splice(tasks.indexOf(t),1);saveAll()})]); r.insertBefore(dot,r.firstChild); L.appendChild(r);
  });
}
function renderMeetings(){
  const L=$("meetList"); L.innerHTML="";
  const sorted=[...meetings].sort((a,b)=>a.tm.localeCompare(b.tm));
  if(!sorted.length){ L.innerHTML='<div class="empty">No meetings yet. Add one below.</div>'; }
  sorted.forEach(m=>{
    const tm=document.createElement("b"); tm.textContent=fmt(m.tm); tm.style.minWidth="76px";
    const r=rowEl(m.t,[delBtn(()=>{meetings.splice(meetings.indexOf(m),1);saveAll()})]); r.insertBefore(tm,r.firstChild); L.appendChild(r);
  });
  const n=sorted[0];
  $("nextWhen").textContent = n ? fmt(n.tm) : "--";
  $("nextTitle").textContent = n ? n.t : "No meetings logged yet.";
}
function fmt(hm){ const [h,m]=hm.split(":").map(Number); return ((h%12)||12)+":"+String(m).padStart(2,"0")+" "+(h>=12?"pm":"am"); }

/* ===== Automatic counts + human icon colour ===== */
function renderCounts(){
  const c={urgent:0,progress:0,notstarted:0};
  tasks.forEach(t=>c[t.s]++);
  $("nU").textContent=c.urgent; $("nP").textContent=c.progress; $("nN").textContent=c.notstarted;
  $("fUrg").textContent=c.urgent+" Urgent";
  $("fAct").textContent=tasks.length+" Active";
  $("fMeet").textContent=meetings.length+(meetings.length===1?" Meeting":" Meetings");
  // The category with the most tasks colours the icon (ties: urgent > in progress > not started)
  let top="notstarted", max=-1;
  ["urgent","progress","notstarted"].forEach(k=>{ if(c[k]>max){max=c[k];top=k} });
  $("prioIcon").style.fill = tasks.length ? `var(--${top})` : "var(--accent)";
  $("prioIcon").parentElement.setAttribute("title", tasks.length ? "Most tasks: "+STATUS[top] : "No tasks yet");
}
function saveAll(){ store.set("tasks",tasks); store.set("meetings",meetings); renderTasks(); renderMeetings(); renderCounts(); }

$("taskForm").onsubmit = e => { e.preventDefault(); const v=$("taskIn").value.trim(); if(!v)return;
  if(!$("taskTm").value)return; tasks.push({t:v,s:$("taskSt").value,tm:$("taskTm").value}); $("taskIn").value=""; $("taskTm").value=""; saveAll(); };
$("meetForm").onsubmit = e => { e.preventDefault(); const v=$("meetIn").value.trim(); if(!v||!$("meetTm").value)return;
  meetings.push({t:v,tm:$("meetTm").value}); $("meetIn").value=""; $("meetTm").value=""; saveAll(); };

/* ===== Start ===== */
applyTheme(); renderClockLabel(); tick(); setInterval(tick,1000); saveAll();
</script>
</body>
</html>
