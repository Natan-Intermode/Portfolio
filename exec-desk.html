<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lier Consig Dashboard</title>
<style>
:root{--bg:#061a3a;--side:#04122b;--card:#0b2a55;--card2:#10376b;--line:#ffffff1c;--text:#eaf2ff;--mut:#9db4d6;--acc:#4cc9e3;--ink:#04204a;--good:#4ade80;--warn:#ffb703;--bad:#ff7070;--info:#7aa7ff;--clock:#0a5d8f;--clock2:#0a3a6a;--cv1:#002147;--cv2:#0a4a8a;--cav:#4cc9e3}
body[data-theme=cream]{--bg:#f6efd3;--side:#efe4b4;--card:#fffbea;--card2:#f5ecc6;--line:#2b220024;--text:#2b2200;--mut:#7a6a30;--acc:#8a5f00;--ink:#fff8e1;--good:#1f7a46;--warn:#9a5b00;--bad:#b3261e;--info:#1b4f9c;--clock:#7a5a0e;--clock2:#4a3506;--cv1:#5c4308;--cv2:#9a7010;--cav:#ffe9a8}
body[data-theme=violet]{--bg:#f1ecfb;--side:#e6dcf7;--card:#faf7ff;--card2:#ebe3fa;--line:#3b1f7a24;--text:#2a1659;--mut:#6d5c99;--acc:#6b3fc4;--ink:#ffffff;--good:#1f7a46;--warn:#9a5b00;--bad:#b3261e;--info:#4a4fc4;--clock:#5b34b0;--clock2:#3a1f80;--cv1:#3a1f80;--cv2:#7b52d3;--cav:#e3d7ff}
body[data-theme=red]{--bg:#fdeeee;--side:#f9dcdc;--card:#fff8f8;--card2:#f9e3e3;--line:#7a1f1f24;--text:#4a1212;--mut:#9a6a6a;--acc:#c0392b;--ink:#ffffff;--good:#1f7a46;--warn:#9a5b00;--bad:#b3261e;--info:#2f5fb3;--clock:#b03030;--clock2:#6e1414;--cv1:#6e1414;--cv2:#c0392b;--cav:#ffd9d9}
body[data-theme=mono]{--bg:#f3f3f3;--side:#ffffff;--card:#ffffff;--card2:#ececec;--line:#00000026;--text:#111111;--mut:#666666;--acc:#111111;--ink:#ffffff;--good:#1a7a3e;--warn:#8a5a00;--bad:#b00020;--info:#333333;--clock:#222222;--clock2:#000000;--cv1:#000000;--cv2:#3a3a3a;--cav:#ffffff}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;transition:background .3s,color .3s}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);padding:22px 0 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.06em;font-size:16px;padding:0 20px 22px}
nav{flex:1}
nav button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 20px;color:var(--mut);font-weight:500;text-align:left}
nav button:hover{color:var(--text)}
nav button.on{background:var(--acc);color:var(--ink);font-weight:600}
.sub{margin:0 14px;display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:10px;background:var(--acc);color:var(--ink);font-weight:700}
main{padding:0 28px 28px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);margin:0 -28px 22px;padding-inline:28px;flex-wrap:wrap}
.crumb{color:var(--mut);display:flex;gap:8px;align-items:center}.crumb span{color:var(--text)}
.tools{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--mut);min-width:230px}
.search input{background:none;border:0;outline:0;flex:1;min-width:0;color:var(--text)}
.upd{color:var(--mut);font-size:12px;display:flex;align-items:center;gap:6px}.upd i,.live i{width:7px;height:7px;border-radius:50%;background:var(--good)}
.chip{border:1px solid var(--line);border-radius:8px;padding:7px 12px;display:inline-flex;align-items:center;gap:8px;background:var(--card)}
.bellb{position:relative;padding:6px}.bellb b{position:absolute;top:0;right:0;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;display:grid;place-items:center}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
h1{font-size:26px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.head p{color:var(--mut);margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:8px;font-size:12px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.live{--c:var(--good);font-size:10px;letter-spacing:.06em}
.clock{background:linear-gradient(135deg,var(--clock),var(--clock2));color:#fff;border-radius:16px;padding:16px 22px;min-width:420px}
.clock>small{font-size:11px;letter-spacing:.08em;opacity:.85;display:block;margin-bottom:6px}
.cities{display:flex;gap:10px}
.cities button{flex:1;text-align:left;padding:6px 10px;border-radius:10px;color:#fff}.cities button:hover{background:#ffffff1f}
.cities small{display:block;font-size:12px;font-weight:600;opacity:.85}
.t{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.hint{font-size:11px;opacity:.7;margin-top:4px}
